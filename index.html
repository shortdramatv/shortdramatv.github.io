<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Drama TV</title>
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
/* ==================== पुराने स्टाइल (बिल्कुल यथावत) ==================== */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;transition: background 0.3s, color 0.3s}

/* LIGHT MODE STYLES */
body.light-mode {
    background:#fff;
    color:#000;
}

body.light-mode .header,
body.light-mode #channelPopup,
body.light-mode .video-card,
body.light-mode .comments input,
body.light-mode .player-header,
body.light-mode #rightPanel {
    background:#f1f1f1;
    border-color:#ddd;
}

body.light-mode .video-card {
    background:#fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

body.light-mode .meta {
    color:#666;
}

body.light-mode .comment {
    color:#444;
}

body.light-mode .panel-btn {
    background: #fff;
    color: #000;
    border-color: #ccc;
}

body.light-mode .stats-item {
    background: #e0e0e0;
    color: #000;
}

body.light-mode .delete-popup-content,
body.light-mode .share-popup-content {
    background: #f0f0f0;
    color: #000;
    border: 1px solid #ccc;
}

/* HEADER */
.header{
 position:fixed;top:0;width:100%;
 display:flex;align-items:center;
 background:#0f0f0f;
 padding:12px;border-bottom:1px solid #222;
 z-index:1000;
 transition: background 0.3s, border-color 0.3s;
}

.menu-btn{font-size:24px;background:none;border:none;color:#fff;margin-right:12px;cursor:pointer}
.logo{font-size:22px;font-weight:bold;cursor:pointer; display: flex; align-items: center; gap: 8px;}
.logo span{color:#ff0000}

/* Update button (logo के साथ) */
.update-link {
    background: #ff0000;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    transition: background 0.3s;
}
.update-link:hover {
    background: #cc0000;
}

/* Header buttons */
.header-buttons {
    margin-left: auto;
    display: flex;
    gap: 10px;
    align-items: center;
}

.refresh-btn,
.more-btn{
 font-size:20px;background:none;border:none;
 color:#fff;cursor:pointer;
 padding: 5px;
 border-radius: 5px;
 transition: background 0.3s;
}

.refresh-btn:hover,
.more-btn:hover {
    background: rgba(255,255,255,0.1);
}

/* CHANNEL POPUP (बायाँ वाला) */
#channelPopup{
 position:fixed;top:0;right:-100%;
 width:100%;height:100%;
 background:#0f0f0f;
 z-index:2000;
 transition:.3s;
 overflow-y:auto;
 border-left: 1px solid #222;
 max-width: 400px;
}

#channelPopup.active{left:0}
.popup-header{
 display:flex;align-items:center;
 padding:15px;border-bottom:1px solid #222
}

.popup-header button{
 font-size:22px;background:none;border:none;color:#fff;margin-right:10px;cursor:pointer
}

.channel-item{
 display:flex;align-items:center;
 padding:15px;border-bottom:1px solid #222;
 cursor:pointer
}

.channel-item img{
 width:50px;height:50px;border-radius:50%;
 margin-right:25px
}

/* ==================== RIGHT SIDE PANEL ==================== */
#rightPanel{
 position:fixed;top:0;right:-100%;
 width:100%;height:100%;
 background:#0f0f0f;
 z-index:2000;
 transition:.3s;
 overflow-y:auto;
 border-left: 1px solid #222;
 max-width: 400px;
}

#rightPanel.active{right:0}
.right-panel-header{
 display:flex;align-items:center;justify-content: space-between;
 padding:15px;border-bottom:1px solid #222
}
.right-panel-header button{
 font-size:22px;background:none;border:none;color:#fff;cursor:pointer
}
.right-panel-content{
 padding: 20px;
 display: flex;
 flex-direction: column;
 gap: 15px;
}
.panel-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 15px;
    background: #1a1a1a;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    transition: background 0.3s;
    border: 1px solid #333;
    cursor: pointer;
}
.panel-btn:hover {
    background: #2a2a2a;
}
.panel-btn i {
    font-size: 24px;
}

/* STATS SECTION */
.stats-container {
    margin-top: 20px;
    border-top: 2px solid #333;
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.stats-item {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    border: 1px solid #333;
}
.stats-icon {
    font-size: 28px;
    color: #ff0000;
    width: 40px;
    text-align: center;
}
.stats-info {
    flex: 1;
}
.stats-label {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 4px;
}
.stats-value {
    font-size: 24px;
    font-weight: bold;
    color: #fff;
}

/* MAIN CONTAINER */
.main-container {
 margin-top: 70px;
 padding: 0;
}

/* VIDEO FEED */
.video-feed {
 display: grid;
 grid-template-columns: 1fr;
 gap: 15px;
}

/* MOBILE (default) */
@media (max-width: 767px) {
 .video-feed {
  grid-template-columns: 1fr;
  padding: 0 0 15px 0;
  margin: 0;
 }
 .main-container { padding: 0; }
 .video-card { margin: 0 0 15px 0; border-radius: 0; }
 .thumbnail { border-radius: 0; }
}

/* TABLET */
@media (min-width: 768px) and (max-width: 1023px) {
 .video-feed { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
 .main-container { padding: 12px; }
}

/* DESKTOP */
@media (min-width: 1024px) {
 .video-feed { grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 1200px; margin: 0 auto; padding: 15px; }
 .main-container { padding: 15px; max-width: 1200px; margin: 0 auto; }
}

/* VIDEO CARD */
.video-card {
 background-color: #1a1a1a;
 border-radius: 8px;
 overflow: hidden;
 transition: transform 0.2s, box-shadow 0.2s;
 cursor: pointer;
}

.video-card:hover {
 transform: translateY(-5px);
 box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.thumbnail { width:100%; aspect-ratio:16/9; object-fit: contain; }

.info{ display:flex; margin-top: 5px; padding: 8px 10px; align-items: flex-start; }
.channel-icon{ width:36px; height:36px; border-radius:50%; margin-right:8px; flex-shrink: 0; }
.text{flex:1}
.title{ font-size:14px; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.3; min-height: 2.4em; }
.meta{ font-size:11px; color:#aaa; }

/* PLAYER */
#player{ position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:3000 }
.player-header{ display:flex; align-items:center; padding:12px; background:#000; }
.back-btn{ font-size:24px; background:none; border:none; color:#fff; margin-right:10px; cursor:pointer; }
video{ width:100%; max-height:55vh; }
.actions{ display:flex; justify-content:space-around; padding:10px; border-top:1px solid #222; }
.actions button{ background:none; border:none; color:#fff; cursor:pointer; }
.comments{ padding:10px; border-top:1px solid #222; max-height: 30vh; overflow-y: auto; }
.comments input{ width:100%; padding:10px; background:#222; border:none; color:#fff; border-radius:6px; margin-bottom: 10px; }
.comment{ font-size:13px; margin-top:8px; color:#ccc; display: flex; justify-content: space-between; align-items: center; padding: 5px; background: #1a1a1a; border-radius: 5px; }
.comment-text { flex: 1; }
.delete-comment { color: #ff5555; cursor: pointer; padding: 0 5px; font-size: 16px; }

/* LOADING */
.loading { text-align: center; padding: 40px; color: #aaa; font-size: 18px; display: none; }
.loading.active { display: block; }

/* ==================== CUSTOM DELETE POPUP ==================== */
.delete-popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 5000;
    justify-content: center;
    align-items: center;
}
.delete-popup.active {
    display: flex;
}
.delete-popup-content {
    background: #2a2a2a;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    max-width: 300px;
    width: 90%;
    border: 2px solid #ff4444;
}
.delete-popup-content p {
    margin-bottom: 20px;
    font-size: 18px;
    color: #fff;
}
.delete-popup-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}
.popup-btn {
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}
.popup-btn.yes {
    background: #ff4444;
    color: white;
}
.popup-btn.yes:hover {
    background: #cc0000;
}
.popup-btn.no {
    background: #444;
    color: white;
}
.popup-btn.no:hover {
    background: #666;
}

/* ==================== SHARE POPUP ==================== */
.share-popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 5001;
    justify-content: center;
    align-items: center;
}
.share-popup.active {
    display: flex;
}
.share-popup-content {
    background: #2a2a2a;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    max-width: 350px;
    width: 90%;
    border: 2px solid #ffaa00;
}
.share-popup-content h3 {
    margin-bottom: 20px;
    color: #ffaa00;
}
.share-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
}
.share-btn-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    background: #1a1a1a;
    padding: 10px;
    border-radius: 12px;
    width: 70px;
    transition: 0.2s;
}
.share-btn-item:hover {
    background: #333;
    transform: scale(1.05);
}
.share-btn-item i {
    font-size: 30px;
}
.share-btn-item span {
    font-size: 12px;
    color: #ddd;
}
.close-share {
    background: #444;
    color: white;
    border: none;
    padding: 8px 25px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}
.close-share:hover {
    background: #666;
}
</style>
</head>

<!-- ==================== FIREBASE SDK ==================== -->
<!-- Add Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// ==================== FIREBASE CONFIGURATION ====================
// 🔴🔴🔴 अपने Firebase प्रोजेक्ट का कॉन्फ़िगरेशन यहाँ डालें 🔴🔴🔴
const firebaseConfig = {
  apiKey: "AIzaSyBUzs-C8M5-I316az0d_UfLK8OOoWrkA6Q",
  authDomain: "dramatv-f4284.firebaseapp.com",
  databaseURL: "https://dramatv-f4284-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dramatv-f4284",
  storageBucket: "dramatv-f4284.firebasestorage.app",
  messagingSenderId: "486451162756",
  appId: "1:486451162756:web:496bc6b5c01db5aca2dcd1"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const globalStoreRef = database.ref('dramaTVStore');

// ==================== GLOBAL DATA CACHE ====================
let globalStore = {
    visitors: 0,
    deviceTracked: {},
    videoStats: {}   // { videoId: { views: 0, likes: 0, comments: [] } }
};

// ==================== FIREBASE HELPER FUNCTIONS ====================
async function fetchGlobalStore() {
    try {
        const snapshot = await globalStoreRef.once('value');
        const data = snapshot.val();
        
        if (!data) {
            // Initialize with default structure
            const defaultData = { visitors: 0, deviceTracked: {}, videoStats: {} };
            await globalStoreRef.set(defaultData);
            return defaultData;
        }
        
        // Ensure data has correct structure
        return {
            visitors: data.visitors || 0,
            deviceTracked: data.deviceTracked || {},
            videoStats: data.videoStats || {}
        };
    } catch (error) {
        console.warn("Error fetching from Firebase, using defaults:", error);
        return { visitors: 0, deviceTracked: {}, videoStats: {} };
    }
}

async function saveGlobalStore(newData) {
    try {
        await globalStoreRef.set(newData);
        globalStore = newData;
        return true;
    } catch (error) {
        console.warn("Error saving to Firebase:", error);
        // Still update local cache
        globalStore = newData;
        return false;
    }
}

// Listen for realtime updates from Firebase
globalStoreRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        globalStore = {
            visitors: data.visitors || 0,
            deviceTracked: data.deviceTracked || {},
            videoStats: data.videoStats || {}
        };
        // Update UI if stats are visible
        updateStatsUI();
        // Update current video card if video is open
        if (current) {
            const stats = getVideoStats(current.id);
            viewsEl.innerText = stats.views;
            likesEl.innerText = stats.likes;
            updateCardUI(current.id);
        }
        // Re-render comments if video is open
        if (current && player.style.display === 'flex') {
            renderComments();
        }
    }
});

// ==================== VISITOR TRACKING ====================
async function trackNewVisitor() {
    let deviceId = localStorage.getItem('device_id');
    let data = await fetchGlobalStore();
    
    if (!deviceId) {
        deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substring(2);
        localStorage.setItem('device_id', deviceId);
        
        if (!data.deviceTracked[deviceId]) {
            data.deviceTracked[deviceId] = true;
            data.visitors = (data.visitors || 0) + 1;
            await saveGlobalStore(data);
        }
    } else {
        if (!data.deviceTracked[deviceId]) {
            data.deviceTracked[deviceId] = true;
            data.visitors = (data.visitors || 0) + 1;
            await saveGlobalStore(data);
        } else {
            // Just update cache without saving
            globalStore = data;
        }
    }
    return data.visitors;
}

// ==================== VIDEO STATS ====================
function getVideoStats(videoId) {
    if (!globalStore.videoStats[videoId]) {
        globalStore.videoStats[videoId] = { views: 0, likes: 0, comments: [] };
    }
    return globalStore.videoStats[videoId];
}

async function incrementVideoViews(videoId) {
    const data = await fetchGlobalStore();
    if (!data.videoStats[videoId]) {
        data.videoStats[videoId] = { views: 0, likes: 0, comments: [] };
    }
    data.videoStats[videoId].views += 1;
    await saveGlobalStore(data);
    return data.videoStats[videoId].views;
}

async function incrementVideoLikes(videoId) {
    const data = await fetchGlobalStore();
    if (!data.videoStats[videoId]) {
        data.videoStats[videoId] = { views: 0, likes: 0, comments: [] };
    }
    data.videoStats[videoId].likes += 1;
    await saveGlobalStore(data);
    return data.videoStats[videoId].likes;
}

// ==================== COMMENTS ====================
function getVideoComments(videoId) {
    return getVideoStats(videoId).comments || [];
}

async function addVideoComment(videoId, commentText) {
    const deviceId = localStorage.getItem('device_id');
    const newComment = {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        text: commentText,
        deviceId: deviceId
    };
    
    const data = await fetchGlobalStore();
    if (!data.videoStats[videoId]) {
        data.videoStats[videoId] = { views: 0, likes: 0, comments: [] };
    }
    if (!data.videoStats[videoId].comments) {
        data.videoStats[videoId].comments = [];
    }
    data.videoStats[videoId].comments.push(newComment);
    await saveGlobalStore(data);
    return data.videoStats[videoId].comments;
}

async function deleteVideoComment(videoId, commentId) {
    const data = await fetchGlobalStore();
    if (data.videoStats[videoId] && data.videoStats[videoId].comments) {
        data.videoStats[videoId].comments = data.videoStats[videoId].comments.filter(c => c.id !== commentId);
        await saveGlobalStore(data);
    }
    return data.videoStats[videoId]?.comments || [];
}

// ==================== TOTAL VIEWS ====================
function getTotalViews() {
    let total = 0;
    for (let id in globalStore.videoStats) {
        total += globalStore.videoStats[id].views || 0;
    }
    return total;
}

// ==================== UI UPDATE ====================
function updateStatsUI() {
    document.getElementById('totalVisitors').innerText = globalStore.visitors || 0;
    document.getElementById('totalViews').innerText = getTotalViews();
    document.getElementById('totalVideos').innerText = videos.length;
}

// ==================== VIDEO DATA ====================
const videos = [

   {
  id: 172,
  title: "पालतू बेटे के लिए मुझे धोखा दिया माता-पिता ने, लेकिन मैं हार नहीं माना और सब कुछ अपने पास ले आया!",
  videoUrl: "https://huggingface.co/datasets/shortdramatv/chinesedramavideo/resolve/main/172.mp4",
  thumbnail: "https://huggingface.co/datasets/shortdramatv/chinesedramaimage/resolve/main/172.jpg",
  channel: "सबको हैरान किया!",
  icon: "https://huggingface.co/datasets/shortdramatv/chinesedramaimage/resolve/main/shk.png",
 },

// ==================== RENDER FUNCTION ====================
const feed = document.getElementById("feed");
const player = document.getElementById("player");
const videoEl = document.getElementById("video");
const viewsEl = document.getElementById("views");
const likesEl = document.getElementById("likes");
const commentList = document.getElementById("commentList");
const loading = document.getElementById("loading");
let current = null;
let savedScrollPos = 0;
let pendingDelete = { commentId: null, videoId: null };

let isRendering = false;
function render(list = videos) {
    if (isRendering) return;
    isRendering = true;
    feed.innerHTML = "";
    loading.classList.add('active');
    
    setTimeout(() => {
        if (!list || list.length === 0) {
            feed.innerHTML = "<div style='text-align: center; padding: 40px; color: #aaa;'>No videos available</div>";
            loading.classList.remove('active');
            isRendering = false;
            return;
        }
        
        list.forEach(v => {
            const stats = getVideoStats(v.id);
            const div = document.createElement("div");
            div.className = "video-card";
            div.innerHTML = `
                <img src="${v.thumbnail}" class="thumbnail" onclick="openVideo(${v.id})">
                <div class="info">
                    <img src="${v.icon}" class="channel-icon">
                    <div class="text">
                        <div class="title">${v.title}</div>
                        <div class="meta" id="vmeta-${v.id}">${v.channel} • ${stats.views} views • ❤️ ${stats.likes}</div>
                    </div>
                </div>`;
            feed.appendChild(div);
        });
        loading.classList.remove('active');
        isRendering = false;
    }, 100);
}

function updateCardUI(id) {
    const stats = getVideoStats(id);
    const metaEl = document.getElementById("vmeta-" + id);
    if (metaEl) {
        const v = videos.find(x => x.id === id);
        metaEl.innerText = `${v.channel} • ${stats.views} views • ❤️ ${stats.likes}`;
    }
}

// ==================== PLAYER FUNCTIONS ====================
async function openVideo(id) {
    savedScrollPos = window.scrollY;
    current = videos.find(v => v.id === id);
    const stats = getVideoStats(current.id);
    viewsEl.innerText = stats.views;
    likesEl.innerText = stats.likes;
    document.getElementById("playerTitle").innerText = current.title;
    videoEl.src = current.videoUrl;
    
    // हर बार प्ले होने पर व्यू बढ़ेगा
    videoEl.onplay = async function() {
        const newViews = await incrementVideoViews(current.id);
        viewsEl.innerText = newViews;
        updateCardUI(current.id);
        updateStatsUI();
    };
    
    renderComments();
    player.style.display = "flex";
    document.body.style.overflow = "hidden";
}

function closePlayer() {
    videoEl.pause();
    videoEl.src = "";
    player.style.display = "none";
    document.body.style.overflow = "auto";
    window.scrollTo(0, savedScrollPos);
}

async function like() {
    const newLikes = await incrementVideoLikes(current.id);
    likesEl.innerText = newLikes;
    updateCardUI(current.id);
}

// ==================== COMMENTS ====================
function renderComments() {
    commentList.innerHTML = "";
    const comments = getVideoComments(current.id);
    if (comments.length === 0) {
        commentList.innerHTML = "<div class='comment'>No comments yet.</div>";
        return;
    }
    const currentDeviceId = localStorage.getItem('device_id');
    comments.forEach(c => {
        const d = document.createElement("div");
        d.className = "comment";
        d.innerHTML = `
            <span class="comment-text">${c.text}</span>
            ${c.deviceId === currentDeviceId ? `<span class="delete-comment" onclick="showDeletePopup('${c.id}', ${current.id})">🗑️</span>` : ''}
        `;
        commentList.appendChild(d);
    });
}

async function addComment(e) {
    if (e.key === "Enter" && e.target.value.trim()) {
        await addVideoComment(current.id, e.target.value.trim());
        e.target.value = "";
        renderComments();
    }
}

// ==================== CUSTOM DELETE POPUP ====================
function showDeletePopup(commentId, videoId) {
    pendingDelete = { commentId, videoId };
    document.getElementById('deletePopup').classList.add('active');
}

function hideDeletePopup() {
    document.getElementById('deletePopup').classList.remove('active');
    pendingDelete = { commentId: null, videoId: null };
}

async function confirmDelete() {
    if (pendingDelete.commentId && pendingDelete.videoId) {
        await deleteVideoComment(pendingDelete.videoId, pendingDelete.commentId);
        if (current && current.id === pendingDelete.videoId) {
            renderComments();
        }
        hideDeletePopup();
    }
}

// ==================== SHARE POPUP ====================
const sharePopup = document.getElementById('sharePopup');
const shareBtn = document.getElementById('shareBtn');
const closeShareBtn = document.getElementById('closeShareBtn');

shareBtn.addEventListener('click', () => {
    sharePopup.classList.add('active');
    closeRightPanel();
});

closeShareBtn.addEventListener('click', () => {
    sharePopup.classList.remove('active');
});

sharePopup.addEventListener('click', (e) => {
    if (e.target === sharePopup) {
        sharePopup.classList.remove('active');
    }
});

const appShareUrl = encodeURIComponent('https://play.google.com/store/apps/details?id=com.nadeemgs.dramatv');
const shareText = encodeURIComponent('Drama TV - Best short drama videos download now!');

document.getElementById('shareWhatsApp').addEventListener('click', () => {
    window.open(`https://wa.me/?text=${shareText}%20${appShareUrl}`, '_blank');
    sharePopup.classList.remove('active');
});

document.getElementById('shareFacebook').addEventListener('click', () => {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${appShareUrl}`, '_blank');
    sharePopup.classList.remove('active');
});

document.getElementById('shareTelegram').addEventListener('click', () => {
    window.open(`https://t.me/share/url?url=${appShareUrl}&text=${shareText}`, '_blank');
    sharePopup.classList.remove('active');
});

// ==================== CHANNEL POPUP ====================
function openChannels() { document.getElementById("channelPopup").classList.add("active"); }
function closeChannels() { document.getElementById("channelPopup").classList.remove("active"); }

const channelContainer = document.getElementById("channelList");
const uniqueChannels = [...new Set(videos.map(v => v.channel))];
uniqueChannels.forEach(name => {
    const v = videos.find(x => x.channel === name);
    const d = document.createElement("div");
    d.className = "channel-item";
    d.innerHTML = `<img src="${v.icon}"><div>${name}</div>`;
    d.onclick = () => { render(videos.filter(x => x.channel === name)); closeChannels(); };
    channelContainer.appendChild(d);
});

function showAll() { render(videos); }
function refreshHome() { location.reload(); }

// ==================== RIGHT PANEL FUNCTIONS ====================
function toggleRightPanel() {
    const panel = document.getElementById('rightPanel');
    panel.classList.toggle('active');
}

function closeRightPanel() {
    document.getElementById('rightPanel').classList.remove('active');
}

// ==================== BUTTON HANDLERS ====================
document.getElementById('rateBtn').addEventListener('click', function(e) {
    e.preventDefault();
    window.open('https://play.google.com/store/apps/details?id=com.nadeemgs.dramatv', '_blank');
    closeRightPanel();
});

document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
document.getElementById('cancelDeleteBtn').addEventListener('click', hideDeletePopup);

// ==================== INITIALIZATION ====================
(async function init() {
    try {
        globalStore = await fetchGlobalStore();
    } catch (e) {
        console.warn("Using default store");
    }
    
    await trackNewVisitor();
    updateStatsUI();
    render(videos);
})();
</script>
